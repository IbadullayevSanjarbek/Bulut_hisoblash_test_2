<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bulut hisoblash — test trenajyori</title>
<style>
:root{--bg:#eef2f6;--card:#fff;--ink:#14202b;--mute:#5b6b7a;--line:#d5dde5;--acc:#0b6e8a;--acc-ink:#fff;--ok:#17814f;--okbg:#dff3e8;--bad:#c0332a;--badbg:#fbe3e0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1820;--card:#17222d;--ink:#e6edf3;--mute:#93a4b4;--line:#2b3a48;--acc:#4cb8d6;--acc-ink:#07202a;--ok:#4cc58a;--okbg:#14342a;--bad:#ff7a70;--badbg:#3a1b19;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1820;--card:#17222d;--ink:#e6edf3;--mute:#93a4b4;--line:#2b3a48;--acc:#4cb8d6;--acc-ink:#07202a;--ok:#4cc58a;--okbg:#14342a;--bad:#ff7a70;--badbg:#3a1b19;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
main{max-width:680px;margin:0 auto;padding:20px 16px 48px}
h1{font-size:1.6rem;line-height:1.2;margin:8px 0 4px}
h2{font-size:1.2rem;margin:0 0 12px}
p.sub{color:var(--mute);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.tools{display:flex;gap:8px;margin:0 0 12px;flex-wrap:wrap}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:10px 14px}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
button.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:600}
button.pri:disabled{opacity:.45;cursor:not-allowed}
.topic{display:flex;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.topic:last-child{border-bottom:0}
.topic input{width:20px;height:20px;accent-color:var(--acc);flex:none}
.topic span.n{margin-left:auto;color:var(--mute);font-size:.9rem;white-space:nowrap}
.opts{display:flex;flex-direction:column;gap:12px;margin:16px 0}
.opt{display:flex;gap:12px;align-items:center;margin:0;padding:12px 14px}
.set{display:flex;gap:16px;flex-wrap:wrap;margin:16px 0;color:var(--mute);font-size:.95rem}
.set label{display:flex;gap:8px;align-items:center;cursor:pointer}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:10px 0 16px}
.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .25s}
.hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;color:var(--mute);font-size:.95rem}
.hd .sc{margin-left:auto;display:flex;gap:14px;font-weight:600}
.ok{color:var(--ok)}.no{color:var(--bad)}
.q{font-size:1.15rem;font-weight:600;margin:6px 0 16px}
.ans{display:block;width:100%;text-align:left;margin:0 0 10px;padding:12px 14px;line-height:1.4}
.ans.right{background:var(--okbg);border-color:var(--ok);color:var(--ok);font-weight:600}
.ans.wrong{background:var(--badbg);border-color:var(--bad);color:var(--bad);font-weight:600}
.ans:disabled{cursor:default}
.foot{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
.big{font-size:3rem;font-weight:700;line-height:1;margin:4px 0}
.row{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:.95rem}
.row:last-child{border:0}
.rv{padding:12px 0;border-bottom:1px solid var(--line)}
.rv:last-child{border:0}
.rv .y{color:var(--bad)}.rv .g{color:var(--ok)}
.hide{display:none}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
</style>
</head>

<main>
<div class="top"><div><h1>Bulut hisoblash testi</h1></div><button id="th" aria-label="Mavzuni almashtirish">Tun/Kun</button></div>

</div>

</section>

<section id="s2" class="hide">
<div class="hd"><span id="pg"></span><span class="sc"><span class="ok" id="c1">To‘g‘ri: 0</span><span class="no" id="c2">Xato: 0</span></span></div>

<div class="q" id="qt"></div>
<div id="ao"></div>
<div class="foot"><button id="fin">Tugatish</button><button class="pri hide" id="nx">Keyingisi</button></div>
</div>

<div class="card">
<h2>Natija</h2>

</main>
<script>
const D=[{"n": 1, "t": 0, "q": "Bulut hisoblash nima?", "o": ["Kompyuter tarmog’ini simsiz ulash texnologiyasi", "Dasturlarni faqat qog’ozda loyihalash usuli", "Ma’lumotlarni faqat lokal diskda saqlash usuli", "Resurslarni internet orqali xizmat sifatida olish"], "a": 3}, {"n": 2, "t": 0, "q": "NIST ta’rifiga ko’ra bulutning nechta asosiy xizmat modeli mavjud?", "o": ["Ikkita", "Beshta", "Uchta", "To’rtta"], "a": 2}, {"n": 3, "t": 0, "q": "On-demand self-service xususiyati nimani bildiradi?", "o": ["Resurs faqat mahalliy ofisda ajratiladi", "Resurs faqat yozma shartnoma asosida ochiladi", "Resursni foydalanuvchi o’zi talab bilan oladi", "Resurs faqat administrator orqali yiliga bir marta beriladi"], "a": 2}, {"n": 4, "t": 0, "q": "Elastiklik (elasticity) nima?", "o": ["Serverni qo’lda o’chirib qo’yish imkoniyati", "Dastur kodining imkon qadar qisqarishi", "Yuklamaga qarab resursni oshirish yoki kamaytirish", "Kompyuter korpusining mustahkamligini oshirish"], "a": 2}, {"n": 5, "t": 0, "q": "Resurs poolingi nimani anglatadi?", "o": ["Har bir mijozga alohida zavod quriladi", "Resurslar faqat bitta foydalanuvchiga biriktiriladi", "Resurslar faqat arxivga olib qo’yiladi", "Resurslar ko’p foydalanuvchi o’rtasida bo’lishiladi"], "a": 3}, {"n": 6, "t": 0, "q": "Measured service (o’lchanadigan xizmat) nimani ta’minlaydi?", "o": ["Resurs sarfini hisoblab borishni", "Resursni doimo bepul berishni", "Resursni foydalanuvchidan yashirishni", "Resursni avtomatik o’chirib qo’yishni"], "a": 0}, {"n": 7, "t": 0, "q": "Pay-as-you-go modeli nimani bildiradi?", "o": ["Faqat qurilma narxini bir marta to’lash", "Ishlatilgan miqdor uchun to’lash", "Xizmatni hech qachon to’lamasdan ishlatish", "Barcha xizmat uchun yillik to’lovni oldindan to’lash"], "a": 1}, {"n": 8, "t": 0, "q": "Public cloud nima?", "o": ["Davlat sirlari saqlanadigan alohida yopiq tarmoq", "Faqat bitta kompaniya uchun yopiq ichki server", "Internetga ulanmagan mahalliy server xonasi", "Provayder boshqaradigan, ko’pchilikka ochiq bulut"], "a": 3}, {"n": 9, "t": 0, "q": "Private cloud nima?", "o": ["Hamma foydalanuvchiga ochiq bepul bulut", "Provayderlar o’rtasida bo’lishiladigan umumiy bulut", "Bitta tashkilot uchun ajratilgan bulut", "Faqat mobil ilovalar uchun mo’ljallangan xizmat"], "a": 2}, {"n": 10, "t": 0, "q": "Hybrid cloud nima?", "o": ["Ommaviy va xususiy bulutning birgalikda ishlatilishi", "Kompyuterni ikki operatsion tizimga bo’lish", "Faqat ikkita virtual mashina yaratib ishlatish", "Bir nechta brauzerni bir vaqtda ishlatish"], "a": 0}, {"n": 11, "t": 0, "q": "Multi-cloud yondashuvi nima?", "o": ["Tarmoqni ikkita kabelga ulash usuli", "Bitta fayl nusxasini ko’paytirish usuli", "Bir nechta provayder bulutidan foydalanish", "Bitta serverda ko’p dastur ishlatish"], "a": 2}, {"n": 12, "t": 0, "q": "Bulut hisoblashning asosiy afzalligi qaysi?", "o": ["Internet aloqasi umuman talab qilinmasligi", "Boshlang’ich xarajatning kamayishi", "Xavfsizlik masalasining butunlay yo’qolishi", "Apparatning butunlay yo’q bo’lib ketishi"], "a": 1}, {"n": 13, "t": 0, "q": "Bulut hisoblashning mumkin bo’lgan kamchiligi qaysi?", "o": ["Xizmatning hech qachon ishlamasligi", "Resurslarni kengaytirib bo’lmasligi", "Faqat bitta mamlakatda ishlashi", "Provayder va internetga bog’liqlik"], "a": 3}, {"n": 14, "t": 0, "q": "Data center (ma’lumotlar markazi) nima?", "o": ["Dasturlar sotiladigan onlayn do’kon", "Foydalanuvchilar ro’yxati jadvali", "Serverlar joylashgan maxsus bino", "Faqat kitoblar saqlanadigan kutubxona arxivi"], "a": 2}, {"n": 15, "t": 0, "q": "Region va Availability Zone (AZ) o’rtasidagi farq nima?", "o": ["Region — parol, AZ — foydalanuvchi nomi", "Region — dastur, AZ — fayl turi", "Region — hudud, AZ — uning ichidagi markaz", "Region — kabel, AZ — simsiz tarmoq"], "a": 2}, {"n": 16, "t": 1, "q": "IaaS qisqartmasi nimani anglatadi?", "o": ["Internet as a Service", "Infrastructure as a Service", "Interface as a System", "Integration and Security"], "a": 1}, {"n": 17, "t": 1, "q": "IaaS n": 27, "t": 1, "q": "Heroku yoki Google App Engine qaysi modelga kiradi?", "o": ["Lokal tarmoq", "PaaS", "IaaS", "SaaS"], "a": 1}, {"n": 28, "t": 1, "q": "Mas’uliyat taqsimoti (shared responsibility) nimani bildiradi?", "o": ["Barcha xavfsizlik vazifasi mijozga tegishli", "Hech kim xavfsizlikka javob bermaydi", "Barcha xavfsizlik vazifasi provayderga tegishli", "Xavfsizlik vazifalari provayder va mijoz o’rtasida bo’linadi"], "a": 3}, {"n": 29, "t": 1, "q": "FaaS (serverless) modelining mohiyati nima?", "o": ["Funksiya hodisa bilan ishga tushadi", "Kod faqat lokal kompyuterda ishlaydi", "Server doim yoqilgan holda ijaraga olinadi", "Fizik server mijoz uyiga yetkazib beriladi"], "a": 0}, {"n": 30, "t": 1, "q": "Serverless atamasida serverlar umuman yo’qmi?", "o": ["Ha, serverlar umuman mavjud emas", "Ular faqat foydalanuvchi tomonida bor", "Ular faqat mijoz telefonida ishlaydi", "Yo’q, ularni provayder boshqaradi"], "a": 3}, {"n": 31, "t": 2, "q": "Virtualizatsiya nima?", "o": ["Bir nechta kompyuterni bittaga birlashtirish", "Ma’lumotni qog’ozga ko’chirib saqlash", "Bitta fizik resursda bir nechta virtual muhit yaratish", "Dasturni boshqa dasturlash tiliga o’tkazish"], "a": 2}, {"n": 32, "t": 2, "q": "Hypervisor nima?", "o": ["Parollarni saqlovchi maxsus dastur", "Fayllarni siquvchi arxivator dasturi", "Virtual mashinalarni boshqaruvchi dastur", "Brauzerga o’rnatiladigan kengaytma"], "a": 2}, {"n": 33, "t": 2, "q": "Type 1 hypervisor qanday ishlaydi?", "o": ["Faqat mobil qurilmalarda o’rnatiladi", "Bevosita apparat ustida ishlaydi", "Faqat brauzer ichida ishlay oladi", "Boshqa operatsion tizim ichida ishga tushadi"], "a": 1}, {"n": 34, "t": 2, "q": "Type 2 hypervisor qanday ishlaydi?", "o": ["Faqat serverlarda o’rnatilib ishlaydi", "Apparatsiz, faqat bulutda ishlaydi", "Mavjud operatsion tizim ustida ishlaydi", "Faqat konteynerlar ichida ishlaydi"], "a": 2}, {"n": 35, "t": 2, "q": "Quyidagilardan qaysi biri Type 2 hypervisor hisoblanadi?", "o": ["VirtualBox", "Docker const T=["Bulut asoslari va xususiyatlari", "Xizmat modellari (IaaS, PaaS, SaaS, FaaS)", "Virtualizatsiya", "Docker va konteynerlar", "Bulut akkaunti va virtual mashina", "Object storage va veb-deploy", "IAM va xavfsizlik", "Monitoring va xarajat", "Kalitlar va shifrlash"];
const $=id=>document.getElementById(id);
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let Q=[],i=0,ok=0,no=0,wrong=[],stat={},locked=false;
function show(id){["s1","s2","s3"].forEach(s=>$(s).classList.toggle("hide",s!==id));window.scrollTo(0,0)}
function sel(){return [...document.querySelectorAll(".topic input")].filter(c=>c.checked).map(c=>+c.value)}
function upd(){const n=D.filter(q=>sel().includes(q.t)).length;$("go").disabled=!n;$("go").textContent=n?"Testni boshlash ("+n+" ta savol)":"Mavzu tanlang"}
$("tl").innerHTML=T.map((t,k)=>'<label class="topic"><input type="checkbox" value="'+k+'" checked><span>'+t+'</span><span class="n">'+D.filter(q=>q.t===k).length+' ta</span></label>').join("");
$("tl").addEventListener("change",upd);
$("all").onclick=()=>{document.querySelectorAll(".topic input").forEach(c=>c.checked=true);upd()};
$("none").onclick=()=>{document.querySelectorAll(".topic input").forEach(c=>c.checked=false);upd()};
upd();
function start(list){
 Q=$("sq").checked?sh(list):list.slice();
 i=0;ok=0;no=0;wrong=[];stat={};
 Q.forEach(q=>{stat[q.t]=stat[q.t]||{ok:0,no:0}});
 show("s2");render();
}
$("go").onclick=()=>{const s=sel();start(D.filter(q=>s.includes(q.t)))};
function render(){
 const q=Q[i];locked=false;
 $("pg").textContent="Savol "+(i+1)+" / "+Q.length;
 $("pb").style.width=(i/Q.length*100)+"%";
 $("c1").textContent="To‘g‘ri: "+ok;$("c2").textContent="Xato: "+no;
 $("qt").textContent=q.q;
 let idx=q.o.map((_,k)=>k);if($("so").checked)idx=sh(idx);
 $("ao").innerHTML="";
 idx.forEach(k=>{const b=document.createElement("button");b.className="ans";b.textContent=q.o[k];b.onclick=()=>pick(b,k);b.dataset.k=k;$("ao").appendChild(b)});
 $("nx").classList.add("hide");
 $("nx").textContent=i===Q.length-1?"Natijani ko‘rish":"Keyingisi";
}
function pick(b,k){
 if(locked)return;locked=true;
 const q=Q[i];
 document.querySelectorAll(".ans").forEach(x=>{x.disabled=true;if(+x.dataset.k===q.a)x.classList.add("right")});
 if(k===q.a){ok++;stat[q.t].ok++}else{no++;stat[q.t].no++;b.classList.add("wrong");wrong.push({q:q,my:q.o[k]})}
 $("c1").textContent="To‘g‘ri: "+ok;$("c2").textContent="Xato: "+no;
 $("pb").style.width=((i+1)/Q.length*100)+"%";
 $("nx").classList.remove("hide");$("nx").focus();
}
$("nx").onclick=()=>{i++;i>=Q.length?finish():render()};
$("fin").onclick=()=>{if(!ok&&!no||confirm("Testni tugatib, natijani ko‘rasizmi?"))finish()};
function finish(){
 const n=ok+no,p=n?Math.round(ok/n*100):0;
 $("rp").textContent=p+"%";
 $("rt").innerHTML='To‘g‘ri: <b class="ok">'+ok+'</b> · Xato: <b class="no">'+no+'</b> · Javob berilgan: '+n+' / '+Q.length;
 $("rtp").innerHTML=Object.keys(stat).filter(k=>stat[k].ok+stat[k].no).map(k=>'<div class="row"><span>'+T[k]+'</span><span><b class="ok">'+stat[k].ok+'</b> / <b class="no">'+stat[k].no+'</b></span></div>').join("");
 $("rw").classList.toggle("hide",!wrong.length);
 $("wc").classList.toggle("hide",!wrong.length);
 $("wl").innerHTML=wrong.map(w=>'<div class="rv"><div><b>'+w.q.n+'. '+w.q.q+'</b></div><div class="y">Sizning javobingiz: '+w.my+'</div><div class="g">To‘g‘ri javob: '+w.q.o[w.q.a]+'</div></div>').join("");
 show("s3");
}
$("rw").onclick=()=>start(wrong.map(w=>w.q));
$("rs").onclick=()=>show("s1");
$("th").onclick=()=>{const r=document.documentElement,d=r.dataset.theme==="dark"||(!r.dataset.theme&&matchMedia("(prefers-color-scheme:dark)").matches);r.dataset.theme=d?"light":"dark"};
</script>
